name: Discord Notification

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.event.head_commit.id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          REPO: ${{ github.repository }}
        run: |
          # First line of the commit message, capped to Discord's 256-char embed title limit
          COMMIT_TITLE=$(printf '%s\n' "$COMMIT_MSG" | head -n1 | cut -c1-256)

          # jq escapes every value, so quotes or newlines cannot break the JSON
          PAYLOAD=$(jq -n \
            --arg title "$COMMIT_TITLE" \
            --arg url "$COMMIT_URL" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg author "$COMMIT_AUTHOR" \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: 3447003,
                fields: [
                  { name: "Repository", value: $repo, inline: false },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: ("`" + $sha + "`"), inline: true },
                  { name: "Author", value: $author, inline: true }
                ],
                footer: { text: "GitHub Push" },
                timestamp: $timestamp
              }]
            }')

          curl -fsS -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
